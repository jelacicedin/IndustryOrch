services:
  # -----------------------------------------------------------------------
  # Neo4j — knowledge graph store
  # -----------------------------------------------------------------------
  neo4j:
    image: neo4j:5.23
    container_name: industryorch-neo4j
    network_mode: host
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-industryorch2026}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-industryorch2026} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - "7474:7474"   # Browser UI (local dev only)
      - "7687:7687"   # Bolt protocol

  # -----------------------------------------------------------------------
  # PostgreSQL + pgvector
  # -----------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: industryorch-postgres
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-industryorch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB:   ${POSTGRES_DB:-industryorch}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/20260505_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industryorch} -d ${POSTGRES_DB:-industryorch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------
  # llama.cpp server — alternative generation backend
  # Uncomment below and set GEN_BACKEND=llama_cpp in .env to use it.
  # Requires MODEL_PATH and MODEL_FILE env vars pointing to a GGUF model.
  # -----------------------------------------------------------------------
  # llama-server:
  #   container_name: industryorch-llama
  #   restart: unless-stopped
  #   ports:
  #     - "${LLAMA_PORT:-8080}:8080"
  #   volumes:
  #     - ${MODEL_PATH:-/data/models}:/models:ro
  #   command: >
  #     /bin/bash -c "
  #       apt-get update && apt-get install -y wget ca-certificates &&
  #       wget -q https://github.com/ggerganov/llama.cpp/releases/download/b3845/llama-server-linux-x64.tar.gz &&
  #       tar xzf llama-server-linux-x64.tar.gz &&
  #       ./llama-server --model /models/${MODEL_FILE} --port 8080 --host 0.0.0.0
  #         --n-gpu-layers 999 -c 32768 --temp 0.6 --top-k 20 --top-p 0.95
  #         --presence-penalty 1.5
  #     "
  #   depends_on:
  #     - ollama

  # -----------------------------------------------------------------------
  # IndustryOrch API server
  # Generation backend controlled by GEN_BACKEND env var:
  #   - "ollama"      (default, uses Ollama chat endpoint)
  #   - "llama_cpp"   (uses llama.cpp /v1/chat/completions)
  # -----------------------------------------------------------------------
  app:
    build:
      context: ./backend
      network: host
      dockerfile: Dockerfile
      args: {}
    container_name: industryorch-app
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-industryorch}:${POSTGRES_PASSWORD:-password}@localhost:5432/${POSTGRES_DB:-industryorch}
      OLLAMA_URL:  http://localhost:11434
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      GEN_BACKEND: ${GEN_BACKEND:-ollama}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen3:14b}
      OLLAMA_THINK: ${OLLAMA_THINK:-true}
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-http://localhost:8080}
      VISION_MODEL: ${VISION_MODEL:-}
      PDF_EXTRACT_MODE: ${PDF_EXTRACT_MODE:-hybrid}
      PDF_VISION_DPI_SCALE: ${PDF_VISION_DPI_SCALE:-2.0}
      APP_PORT: ${APP_PORT:-8001}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-industryorch2026}
      GRAPH_EXTRACTION_MODEL: ${GRAPH_EXTRACTION_MODEL:-qwen2.5:1.5b}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # Streamlit frontend — web UI for document Q&A
  # -----------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: industryorch-streamlit
    network_mode: host
    restart: unless-stopped
    environment:
      BACKEND_URL: http://localhost:${APP_PORT:-8000}
    depends_on:
      - app

  # -----------------------------------------------------------------------
  # Ingestion worker — pulls files from /ingest and processes them
  # -----------------------------------------------------------------------

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
